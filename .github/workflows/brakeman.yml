name: Brakeman

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ruby:3.4.2
    steps:
    - uses: actions/checkout@v7
    - name: Install Brakeman
      run: |
        gem install --no-format-executable brakeman -v 7.1.1
    - name: Brakeman
      run: |
        cd src/api
        brakeman -w3 --add-valid-ignored-warnings --remove-invalid-ignored-warnings || true
        cat config/brakeman.ignore
